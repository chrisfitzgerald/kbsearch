<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Base Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1e1e1e;
            color: #cccccc;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #252526;
            border-radius: 8px;
            border: 1px solid #3e3e3e;
            overflow: hidden;
        }
        
        .header {
            background: #2d2d30;
            color: #cccccc;
            padding: 30px;
            text-align: center;
            border-bottom: 1px solid #3e3e3e;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            color: #ffffff;
        }
        
        .header p {
            color: #858585;
        }
        
        .search-section {
            padding: 30px;
            background: #252526;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        #searchInput {
            flex: 1;
            padding: 12px 15px;
            font-size: 16px;
            background: #1e1e1e;
            color: #cccccc;
            border: 1px solid #3e3e3e;
            border-radius: 4px;
            transition: border-color 0.2s;
        }
        
        #searchInput:focus {
            outline: none;
            border-color: #007acc;
        }
        
        #searchInput::placeholder {
            color: #6a6a6a;
        }
        
        #searchButton {
            padding: 12px 24px;
            font-size: 16px;
            background: #007acc;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        #searchButton:hover {
            background: #005a9e;
        }
        
        #searchButton:disabled {
            background: #3e3e3e;
            color: #6a6a6a;
            cursor: not-allowed;
        }
        
        .api-config {
            display: block;
            margin-bottom: 20px;
            padding: 15px;
            background: #1e1e1e;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .api-config input {
            padding: 8px;
            border: 1px solid #3e3e3e;
            border-radius: 4px;
            width: 300px;
            background: #252526;
            color: #cccccc;
        }
        
        .results {
            margin-top: 20px;
        }
        
        .result-item {
            border: 1px solid #3e3e3e;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 15px;
            background: #1e1e1e;
            transition: border-color 0.2s, background 0.2s;
        }
        
        .result-item:hover {
            border-color: #007acc;
            background: #252526;
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }
        
        .result-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #4ec9b0;
            margin-bottom: 5px;
        }
        
        .result-score {
            background: #007acc;
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
        }
        
        .result-meta {
            color: #858585;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        
        .result-content {
            color: #cccccc;
            line-height: 1.6;
            margin-top: 10px;
        }
        
        .error {
            background: #3a1d1d;
            color: #f48771;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            border: 1px solid #5a2d2d;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #858585;
        }
        
        .no-results {
            text-align: center;
            padding: 40px;
            color: #6a6a6a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Knowledge Base Search</h1>
            <p>Search through your organization's knowledge base</p>
        </div>
        
        <div class="search-section">
            <div class="api-config">
                <label for="apiUrl">API URL: </label>
                <input type="text" id="apiUrl" value="http://localhost:8000" placeholder="http://localhost:8000">
                <small style="color: #666; margin-left: 10px;">Change this if your API is hosted elsewhere</small>
            </div>
            
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Enter your search query..."
                    onkeypress="if(event.key === 'Enter') search()"
                >
                <button id="searchButton" onclick="search()">Search</button>
            </div>
            
            <div id="results" class="results"></div>
        </div>
    </div>

    <script>
        const API_URL_KEY = 'kb_api_url';
        
        // Load saved API URL
        const savedUrl = localStorage.getItem(API_URL_KEY);
        if (savedUrl) {
            document.getElementById('apiUrl').value = savedUrl;
        }
        
        // Save API URL when changed
        document.getElementById('apiUrl').addEventListener('change', (e) => {
            localStorage.setItem(API_URL_KEY, e.target.value);
        });
        
        async function search() {
            const query = document.getElementById('searchInput').value.trim();
            const apiUrl = document.getElementById('apiUrl').value.trim();
            const resultsDiv = document.getElementById('results');
            const searchButton = document.getElementById('searchButton');
            
            if (!query) {
                resultsDiv.innerHTML = '<div class="error">Please enter a search query</div>';
                return;
            }
            
            // Disable button and show loading
            searchButton.disabled = true;
            searchButton.textContent = 'Searching...';
            resultsDiv.innerHTML = '<div class="loading">Searching knowledge base...</div>';
            
            try {
                const url = `${apiUrl}/kb-search?q=${encodeURIComponent(query)}&top_k=5`;
                const response = await fetch(url, {
                    headers: {
                        'Accept': 'application/json',
                        'ngrok-skip-browser-warning': 'true' // Skip ngrok warning page
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`API error: ${response.status} ${response.statusText}`);
                }
                
                // Check if response is HTML (ngrok warning page) instead of JSON
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    if (text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html')) {
                        throw new Error('ngrok warning page detected. Please visit the ngrok URL directly in your browser first to bypass the warning, then try again.');
                    }
                    throw new Error(`Expected JSON but got ${contentType}. Response: ${text.substring(0, 100)}...`);
                }
                
                const data = await response.json();
                
                if (data.error) {
                    resultsDiv.innerHTML = `<div class="error">Error: ${data.error}</div>`;
                    return;
                }
                
                if (!data.results || data.results.length === 0) {
                    resultsDiv.innerHTML = '<div class="no-results">No results found. Try a different search query.</div>';
                    return;
                }
                
                // Display results
                let html = `<div style="margin-bottom: 15px; color: #858585;">Found ${data.result_count} result(s) for "${data.query}"</div>`;
                
                data.results.forEach((result, index) => {
                    html += `
                        <div class="result-item">
                            <div class="result-header">
                                <div>
                                    <div class="result-title">${escapeHtml(result.title)}</div>
                                    <div class="result-meta">
                                        ${result.article_number ? `Article #${escapeHtml(result.article_number)} • ` : ''}
                                        ${escapeHtml(result.category)} • 
                                        ${result.tags && result.tags.length > 0 ? `Tags: ${result.tags.map(t => escapeHtml(t)).join(', ')}` : 'No tags'}
                                    </div>
                                </div>
                                <div class="result-score">${(result.score * 100).toFixed(1)}% match</div>
                            </div>
                            ${result.error_codes && result.error_codes.length > 0 ? 
                                `<div style="margin: 10px 0; color: #f48771;"><strong>Error Codes:</strong> ${result.error_codes.map(c => escapeHtml(c)).join(', ')}</div>` 
                                : ''}
                            <div class="result-content">${escapeHtml(result.content_preview)}${result.content_preview.length >= 500 ? '...' : ''}</div>
                        </div>
                    `;
                });
                
                resultsDiv.innerHTML = html;
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error connecting to API: ${error.message}<br><small>Make sure the API is running at ${apiUrl}</small></div>`;
            } finally {
                searchButton.disabled = false;
                searchButton.textContent = 'Search';
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
